name: CI

# Every pull request and every merge into main: type-check, lint, check formatting and test.
# After a merge into main: build the Windows installer and publish it as the "Latest build"
# release (replacing the previous one), so the newest installer is always one click away.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Install scripts would compile headless-gl (pulled in by OpenSheetMusicDisplay), which
      # the app never uses; nothing else needs them here.
      - run: npm ci --ignore-scripts
      - run: npm run check

  installer:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    # A newer merge replaces a build still running.
    concurrency:
      group: installer-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Electron's own download (skipped above with the other install scripts).
      - run: node node_modules/electron/install.js
      - run: npm run build
      - name: Build the installer
        run: >-
          npx electron-builder --win --publish never
          --config.extraMetadata.version=0.1.${{ github.run_number }}
          --config.nsis.artifactName=Piano-Teacher-Setup.exe
      - name: Publish it as the "Latest build" release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=$(git log -1 --format=%s)
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build release/Piano-Teacher-Setup.exe \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build" \
            --notes "Windows installer for version 0.1.${{ github.run_number }}, built from $GITHUB_SHA ($subject). Download Piano-Teacher-Setup.exe below and run it; Windows may warn that it's unsigned (More info → Run anyway)."
