name: CI

# Every pull request and every merge into main: type-check, lint, check formatting and test.
# After a merge into main: build the Windows installer and publish it as the "Latest build"
# release (replacing the previous one), so the newest installer is always one click away; and
# publish the web app on GitHub Pages.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Install scripts would compile headless-gl (pulled in by OpenSheetMusicDisplay), which
      # the app never uses; nothing else needs them here.
      - run: npm ci --ignore-scripts
      - run: npm run check

  installer:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    # A newer merge replaces a build still running.
    concurrency:
      group: installer-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Electron's own download (skipped above with the other install scripts).
      - run: node node_modules/electron/install.js
      - run: npm run build
      - name: Build the installer
        run: >-
          npx electron-builder --win --publish never
          --config.extraMetadata.version=0.1.${{ github.run_number }}
          --config.nsis.artifactName=Music-Teacher-Setup.exe
      - name: Publish it as the "Latest build" release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=$(git log -1 --format=%s)
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build release/Music-Teacher-Setup.exe \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build" \
            --notes "Windows installer for version 0.1.${{ github.run_number }}, built from $GITHUB_SHA ($subject). Download Music-Teacher-Setup.exe below and run it; Windows may warn that it's unsigned (More info → Run anyway)."

  pages:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One deployment at a time; a newer merge waits for the one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Pages serves the site under the repository's name, so the app is built for that path.
      - run: npm run build -- --base "/${{ github.event.repository.name }}/"
      # Pages knows nothing of the app's own addresses (/lesson/u1-l1): it answers them with
      # 404.html, which is the app, and the app shows the page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
